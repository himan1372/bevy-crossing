[workspace]
members = ["logic", "app", "disc"]
resolver = "2"

# Line tables only: full debug info grew the app's PDB past the
# MSVC linker's limit (LNK1318). Dependencies keep none.
[profile.dev]
debug = "line-tables-only"

# Dependencies (Bevy, wgpu) optimised: unoptimised they held the dev
# build just under 60 fps; our own crates stay quick to rebuild.
[profile.dev.package."*"]
debug = false
opt-level = 3
